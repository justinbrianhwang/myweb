<html lang="en">
<head>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .j-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 20px;
      align-items: center;
    }

    .j-search {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .j-search i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .j-search input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .j-search input:focus {
      outline: none;
      border-color: rgb(var(--page-color, 108, 99, 255));
      box-shadow: 0 0 0 3px rgba(var(--page-color, 108, 99, 255), 0.1);
    }

    .j-filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .j-filter-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .j-filter-btn:hover {
      border-color: rgba(var(--page-color, 108, 99, 255), 0.4);
    }

    .j-filter-btn.active {
      background: rgb(var(--page-color, 108, 99, 255));
      color: white;
      border-color: rgb(var(--page-color, 108, 99, 255));
    }

    .j-filter-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .j-filter-label {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 8px;
      align-self: center;
      min-width: 50px;
    }

    .j-table-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      overflow-x: auto;
    }

    .j-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .j-table thead {
      background: rgba(var(--page-color, 108, 99, 255), 0.06);
      border-bottom: 2px solid rgba(var(--page-color, 108, 99, 255), 0.15);
    }

    .j-table th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 700;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgb(var(--page-color, 108, 99, 255));
      white-space: nowrap;
    }

    .j-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease;
    }

    .j-table tbody tr:last-child {
      border-bottom: none;
    }

    .j-table tbody tr:hover {
      background: rgba(var(--page-color, 108, 99, 255), 0.04);
    }

    .j-table td {
      padding: 12px 16px;
      color: var(--text-primary);
      vertical-align: top;
    }

    .j-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .j-abbr {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 400;
      margin-top: 2px;
    }

    .j-pub {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .j-host {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.7;
      margin-top: 2px;
    }

    .q-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      min-width: 40px;
      text-align: center;
    }

    .q-badge--q1 { background: #fbeae5; color: #c53030; }
    .q-badge--q2 { background: #fff1cc; color: #b7791f; }
    .q-badge--q3 { background: #d4e4f7; color: #2b6cb0; }
    .q-badge--q4 { background: #e5e7eb; color: #4b5563; }

    .field-chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.73rem;
      font-weight: 500;
      background: rgba(var(--page-color, 108, 99, 255), 0.08);
      color: rgb(var(--page-color, 108, 99, 255));
      white-space: nowrap;
    }

    .if-cell {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.88rem;
    }

    .j-strength {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 280px;
    }

    .j-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 24px 0 12px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .j-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .j-empty {
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
    }

    .j-count {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 10px;
      text-align: right;
    }

    @media (max-width: 768px) {
      .j-table {
        font-size: 0.8rem;
      }
      .j-table th,
      .j-table td {
        padding: 10px 12px;
      }
      .j-strength {
        max-width: 200px;
      }
    }
  </style>
</head>

  <script src="../js/theme.js"></script>

  <main class="page-content" data-theme="journal">
    <div class="container">
      <h1 class="page-title">
        <span class="page-icon"><i class="fas fa-book"></i></span>
        CS Journals
      </h1>
      <p class="page-subtitle">SCIE-indexed journals across CS with publishers, tiers, and strengths.</p>

      <div class="j-legend">
        <span class="j-legend-item"><span class="q-badge q-badge--q1">Q1</span> Top 25% (IF)</span>
        <span class="j-legend-item"><span class="q-badge q-badge--q2">Q2</span> 25–50%</span>
        <span class="j-legend-item"><span class="q-badge q-badge--q3">Q3</span> 50–75%</span>
        <span class="j-legend-item"><span class="q-badge q-badge--q4">Q4</span> Bottom 25%</span>
      </div>

      <div class="j-controls">
        <div class="j-search">
          <i class="fas fa-search"></i>
          <input type="text" id="jSearch" placeholder="Search by journal name, abbreviation, or publisher...">
        </div>
      </div>

      <div class="j-filter-row">
        <span class="j-filter-label">Field</span>
        <div class="j-filter-group" id="fieldFilters"></div>
      </div>

      <div class="j-filter-row">
        <span class="j-filter-label">Tier</span>
        <div class="j-filter-group" id="tierFilters">
          <button class="j-filter-btn active" data-q="all">All</button>
          <button class="j-filter-btn" data-q="Q1">Q1</button>
          <button class="j-filter-btn" data-q="Q2">Q2</button>
          <button class="j-filter-btn" data-q="Q3">Q3</button>
          <button class="j-filter-btn" data-q="Q4">Q4</button>
        </div>
      </div>

      <div class="j-table-wrapper">
        <table class="j-table" id="jTable">
          <thead>
            <tr>
              <th>Journal</th>
              <th>Publisher / Hosting Society</th>
              <th>Field</th>
              <th>Tier</th>
              <th>IF</th>
              <th>Strengths</th>
            </tr>
          </thead>
          <tbody id="jTableBody"></tbody>
        </table>
        <div class="j-empty" id="jEmpty" style="display:none;">
          <i class="fas fa-inbox" style="font-size:2rem; opacity:0.3; margin-bottom:10px;"></i>
          <p>No journals match your filter.</p>
        </div>
      </div>

      <div class="j-count" id="jCount"></div>
    </div>
  </main>

    const FIELDS = ["All", ...new Set(JOURNALS.map(j => j.field))].sort();
    const fieldFilters = document.getElementById('fieldFilters');
    fieldFilters.innerHTML = FIELDS.map((f, i) =>
      `<button class="j-filter-btn${i === 0 ? ' active' : ''}" data-field="${f}">${f}</button>`
    ).join('');

    const Q_CLASS = { "Q1": "q-badge--q1", "Q2": "q-badge--q2", "Q3": "q-badge--q3", "Q4": "q-badge--q4" };

    const tbody = document.getElementById('jTableBody');
    const empty = document.getElementById('jEmpty');
    const count = document.getElementById('jCount');
    const search = document.getElementById('jSearch');
    const tierFilters = document.getElementById('tierFilters');

    let activeField = 'All';
    let activeTier = 'all';
    let query = '';

    function render() {
      const q = query.toLowerCase();
      const filtered = JOURNALS.filter(j => {
        const matchField = activeField === 'All' || j.field === activeField;
        const matchTier = activeTier === 'all' || j.tier === activeTier;
        const matchText = !q
          || j.name.toLowerCase().includes(q)
          || j.abbr.toLowerCase().includes(q)
          || j.publisher.toLowerCase().includes(q)
          || j.host.toLowerCase().includes(q)
          || j.strength.toLowerCase().includes(q);
        return matchField && matchTier && matchText;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        count.textContent = '';
        return;
      }
      empty.style.display = 'none';
      tbody.innerHTML = filtered.map(j => `
        <tr>
          <td class="j-name">${j.name}<span class="j-abbr">${j.abbr}</span></td>
          <td class="j-pub">${j.publisher}<span class="j-host">${j.host === '—' ? '' : j.host}</span></td>
          <td><span class="field-chip">${j.field}</span></td>
          <td><span class="q-badge ${Q_CLASS[j.tier] || ''}">${j.tier}</span></td>
          <td class="if-cell">${j.if}</td>
          <td class="j-strength">${j.strength}</td>
        </tr>
      `).join('');
      count.textContent = `Showing ${filtered.length} of ${JOURNALS.length} journals`;
    }

    search.addEventListener('input', e => {
      query = e.target.value;
      render();
    });

    fieldFilters.addEventListener('click', e => {
      const btn = e.target.closest('.j-filter-btn');
      if (!btn) return;
      fieldFilters.querySelectorAll('.j-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeField = btn.dataset.field;
      render();
    });

    tierFilters.addEventListener('click', e => {
      const btn = e.target.closest('.j-filter-btn');
      if (!btn) return;
      tierFilters.querySelectorAll('.j-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTier = btn.dataset.q;
      render();
    });

    render();
  </script>
</body>
</html>
