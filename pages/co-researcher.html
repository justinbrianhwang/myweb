<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co-Researcher — Sunjun Hwang</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Co-researcher cards are display-only (no expand interaction) */
    .co-researcher-page .pupil-card { cursor: default; }
    .co-researcher-page .pupil-card:hover { transform: none; }
  </style>
</head>
<body>
  <script src="../js/theme.js"></script>
  <script src="../js/sidebar.js"></script>

  <main class="page-content co-researcher-page" data-theme="about">
    <div class="container">
      <h1 class="page-title">
        <span class="page-icon"><i class="fas fa-users"></i></span>
        Co-Researcher
      </h1>
      <p class="page-subtitle">Fellow researchers I collaborate with on ongoing research projects and joint work.</p>

      <section class="pupil-section" data-color="purple">
        <h2 class="pupil-category">
          <span class="category-dot" style="background: #6c63ff;"></span>
          Co-Researchers
        </h2>
        <div class="pupil-grid">

          <div class="pupil-card">
            <div class="pupil-card-header">
              <div class="pupil-photo">
                <img src="../assets/photos/co-researcher/dohyun-hwang.jpg" alt="Dohyun Hwang" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="pupil-avatar-fallback"><i class="fas fa-user"></i></div>
              </div>
              <div class="pupil-info">
                <h3>Dohyun Hwang</h3>
                <p class="pupil-interest"><i class="fas fa-users"></i> Co-Researcher</p>
              </div>
            </div>
          </div>

          <div class="pupil-card">
            <div class="pupil-card-header">
              <div class="pupil-photo">
                <img src="../assets/photos/co-researcher/raffaele-sassone.jpg" alt="Raffaele Sassone" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="pupil-avatar-fallback"><i class="fas fa-user"></i></div>
              </div>
              <div class="pupil-info">
                <h3>Raffaele Sassone</h3>
                <p class="pupil-interest"><i class="fas fa-users"></i> Co-Researcher</p>
              </div>
            </div>
          </div>

          <div class="pupil-card">
            <div class="pupil-card-header">
              <div class="pupil-photo">
                <img src="../assets/photos/co-researcher/pablo-lipa.jpg" alt="Pablo Lipa" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="pupil-avatar-fallback"><i class="fas fa-user"></i></div>
              </div>
              <div class="pupil-info">
                <h3>Pablo Lipa</h3>
                <p class="pupil-interest"><i class="fas fa-users"></i> Co-Researcher</p>
              </div>
            </div>
          </div>

        </div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Sunjun Hwang. All Rights Reserved.</p>
  </footer>
